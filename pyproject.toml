[project]
name = "nekt-tap-s3-csv"
version = "1.0.0"
description = "Tap for extracting CSV files from S3"
authors = [{name = "Nekt", email = "pedro@nekt.com"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "nekt-singer-sdk @ git+https://github.com/nektcom/singer-sdk.git@v0.3.0",
    "boto3>=1.26.165",
    "s3fs>=2024.9.0",
    "aws-assume-role-lib>=2.10.0",
    "pandas>=2.2.2",
    "backoff>=2.0.0",
    "ujson>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.9",
]
test = [
    "pytest>=7.1.0",
    "pytest-cov>=3.0.0", 
    "pylint>=2.12.0",
]

[project.scripts]
tap-s3-csv = "tap_s3_csv.tap:TapS3CSV.cli"

[project.urls]
Homepage = "https://github.com/nektcom/tap-s3-csv"
Repository = "https://github.com/nektcom/tap-s3-csv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tap_s3_csv"]

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-few-public-methods",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]